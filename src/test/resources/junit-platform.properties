# ==========================================================================
# Cucumber JUnit Platform Engine configuration.
# These act as defaults; JVM system properties (e.g. -Dcucumber.filter.tags)
# always take precedence over this file.
# ==========================================================================

# ---------------------------------------------------------------------------
# Reports
#   json     -> target/cucumber.json
#   html     -> target/cucumber-report.html (single self-contained file)
#   timeline -> target/cucumber-timeline-report/ (parallel execution timeline)
#   pretty   -> readable console output
# ---------------------------------------------------------------------------
cucumber.plugin=pretty, json:target/cucumber.json, html:target/cucumber-report.html, timeline:target/cucumber-timeline-report

# Do not publish results to the public Cucumber Reports service.
cucumber.publish.enabled=false

# ---------------------------------------------------------------------------
# Default tag filter: exclude the @ui web-smoke feature so `mvn clean test`
# runs only fast, deterministic domain scenarios. Override on the CLI, e.g.:
#   mvn test -Dcucumber.filter.tags="@smoke"
#   mvn test -Dcucumber.filter.tags="@validation"
#   mvn test -Dcucumber.filter.tags="@ui"
# ---------------------------------------------------------------------------
cucumber.filter.tags=not @ui

# ---------------------------------------------------------------------------
# Parallel execution.
# The Cucumber engine schedules scenarios on a shared thread pool; each worker
# thread gets its own WebDriver (ThreadLocal) and its own ScenarioContext, so
# the framework is safe under parallel runs. Override with:
#   mvn test -Dcucumber.execution.parallel.enabled=false
#   mvn test -Dcucumber.execution.parallel.config.fixed.parallelism=8
# ---------------------------------------------------------------------------
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4

# JUnit Platform concurrency settings (used by the @Suite engine container).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
