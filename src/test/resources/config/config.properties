# ==========================================================================
# Framework configuration.
# Values here are DEFAULTS only: any value may be overridden on the command
# line with a JVM system property, e.g.:
#   mvn test -Dbrowser=firefox -Dheadless=true -DexplicitWait=15
# ==========================================================================

# Supported browsers: chrome | firefox
browser=chrome

# Run browsers without a visible window (recommended for CI).
headless=false

# Base URL of the application under test. Empty = domain-only tests /
# page objects may fall back to their own default URL.
baseUrl=

# Default explicit-wait timeout (seconds) for UI automation.
explicitWait=10

# Capture a screenshot and attach it to the report when a browser scenario fails.
screenshotOnFailure=true
