# ==========================================================================
# GitLab CI sample configuration for the Cucumber BDD framework.
#
# Runs the full suite headless in a containerised JDK 21 LTS image.
# Selenium Manager downloads matching browser drivers automatically, so no
# manual driver installation is required on the runner.
# ==========================================================================
stages:
  - test

variables:
  # Cache Maven artifacts between pipeline runs.
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors"

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .m2/repository/

test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn $MAVEN_CLI_OPTS clean test -Dheadless=true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - target/cucumber.json
      - target/cucumber-report.html
      - target/cucumber-timeline-report/
      - target/test-logs/
      - target/surefire-reports/
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
